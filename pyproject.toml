[project]
name = "rag-assistant-chunking-embedding-vector-search"
version = "0.1.0"
description = "Enterprise knowledge base RAG/GraphRAG starter kit"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[project.optional-dependencies]
rerank = [
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]

agent = [
  "langgraph>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-ollama>=0.2.0",
  "httpx[socks]",
]

api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]
