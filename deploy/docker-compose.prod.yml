services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_assistant
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../sql/006_operational_hardening.sql:/docker-entrypoint-initdb.d/006_operational_hardening.sql:ro
      - ../sql/007_rag_caches.sql:/docker-entrypoint-initdb.d/007_rag_caches.sql:ro
      - ../sql/008_vector_indexes.sql:/docker-entrypoint-initdb.d/008_vector_indexes.sql:ro
      - ../sql/009_research_fact_graph.sql:/docker-entrypoint-initdb.d/009_research_fact_graph.sql:ro
      - ../sql/010_async_job_queue.sql:/docker-entrypoint-initdb.d/010_async_job_queue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        INSTALL_AGENT: "1"
        INSTALL_RERANK: ${INSTALL_RERANK:-0}
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-rag}@postgres:5432/rag_assistant
      RAG_API_KEYS: ${RAG_API_KEYS:-}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      RAG_ENABLE_VECTOR: ${RAG_ENABLE_VECTOR:-1}
      RAG_ENABLE_RERANK: ${RAG_ENABLE_RERANK:-1}
      RAG_RERANK_BACKEND: ${RAG_RERANK_BACKEND:-bge}
      RAG_VECTOR_CANDIDATES: ${RAG_VECTOR_CANDIDATES:-10}
      RAG_RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-30}
      RAG_WARMUP_ON_STARTUP: ${RAG_WARMUP_ON_STARTUP:-1}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "rag_assistant.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        INSTALL_AGENT: "1"
        INSTALL_RERANK: ${INSTALL_RERANK:-0}
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-rag}@postgres:5432/rag_assistant
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      RAG_ENABLE_VECTOR: ${RAG_ENABLE_VECTOR:-1}
      RAG_ENABLE_RERANK: ${RAG_ENABLE_RERANK:-1}
      RAG_RERANK_BACKEND: ${RAG_RERANK_BACKEND:-bge}
      RAG_VECTOR_CANDIDATES: ${RAG_VECTOR_CANDIDATES:-10}
      RAG_RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-30}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "scripts/job_worker.py", "--sleep", "1", "--worker-id", "prod-worker"]
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app:ro
      - frontend_dist:/out
    environment:
      NODE_ENV: production
    command: ["sh", "-lc", "rm -rf /out/* && npm ci && npm run build && cp -r dist/* /out/"]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dist:
  caddy_data:
  caddy_config:

